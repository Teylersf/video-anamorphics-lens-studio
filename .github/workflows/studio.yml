name: Anamorphic Studio checks
on:
  push:
    paths:
      - 'app/**'
      - 'tools/anamorphic-studio/**'
      - '.github/workflows/studio.yml'
      - '.gitattributes'
      - '*.command'
      - 'requirements-macos.txt'
      - 'docs/MACOS.md'
      - 'README.md'
  pull_request:
    paths:
      - 'app/**'
      - 'tools/anamorphic-studio/**'
      - '.github/workflows/studio.yml'
      - '.gitattributes'
      - '*.command'
      - 'requirements-macos.txt'
      - 'docs/MACOS.md'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npm run lint
        working-directory: app
  media-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STUDIO_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r tools/anamorphic-studio/requirements.txt
      - run: python tools/anamorphic-studio/test_runtime_backend.py
      - run: python tools/anamorphic-studio/test_studio_engine.py
      - run: python tools/anamorphic-studio/test_server.py
      - run: python tools/anamorphic-studio/test_launch.py
      - run: python tools/anamorphic-studio/test_media_pipeline.py
  macos-contracts:
    # Standard ARM64 runner; architecture does not imply a usable Metal GPU.
    runs-on: macos-15
    timeout-minutes: 40
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      PYTORCH_ENABLE_MPS_FALLBACK: '0'
      STUDIO_GPU_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64
          cache: pip
          cache-dependency-path: |
            requirements-macos.txt
            tools/anamorphic-studio/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: arm64
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Validate native tools and launcher syntax
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          sw_vers
          python -c "import platform,sys; print(sys.version, platform.machine()); assert platform.machine() == 'arm64'"
          node -e "console.log(process.version, process.arch); if(process.arch!=='arm64') process.exit(1)"
          for script in "SETUP MAC.command" "START ANAMORPHIC STUDIO.command" "STOP ANAMORPHIC STUDIO.command"; do
            bash -n "$script"
          done
          python - <<'PY'
          from pathlib import Path
          for path in Path('.').glob('*.command'):
              assert b'\r' not in path.read_bytes(), f'{path} must use LF line endings'
          PY
      - name: Provide FFmpeg prerequisites
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Run the actual Mac setup without starting Studio
        shell: bash
        run: PYTHON3="$(command -v python)" bash "SETUP MAC.command"
      - name: Report actual architecture and backend availability
        shell: bash
        run: |
          .venv-studio/bin/python - <<'PY'
          import json, os, platform, sys
          from pathlib import Path
          import torch
          sys.path.insert(0, 'tools/anamorphic-studio')
          from runtime_backend import backend_info
          report = {'architecture': platform.machine(), 'python': platform.python_version(),
                    'torch': torch.__version__, 'mps_built': torch.backends.mps.is_built(),
                    'mps_available': torch.backends.mps.is_available(), 'backend': backend_info()}
          print(json.dumps(report, indent=2))
          assert report['architecture'] == 'arm64'
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('Mac runtime observation\n\n' + json.dumps(report, indent=2) + '\n\n')
              summary.write('MPS tests run only if availability is true. ARM64/CPU results do not establish Metal throughput. No 8K stress is run.\n')
          PY
      - name: Portable runtime and conditional MPS engine tests
        shell: bash
        run: |
          .venv-studio/bin/python tools/anamorphic-studio/test_runtime_backend.py
          .venv-studio/bin/python tools/anamorphic-studio/test_studio_engine.py
      - name: Server and launcher regressions
        shell: bash
        run: |
          .venv-studio/bin/python tools/anamorphic-studio/test_server.py
          .venv-studio/bin/python tools/anamorphic-studio/test_launch.py
      - name: Actual small CPU codec round trips
        env:
          STUDIO_DEVICE: cpu
        run: .venv-studio/bin/python tools/anamorphic-studio/test_media_pipeline.py
      - name: Lint the setup-built client
        run: npm --prefix app run lint
      - name: Start and stop Mac wrappers on the ephemeral runner
        timeout-minutes: 4
        env:
          STUDIO_DEVICE: cpu
        shell: bash
        run: |
          .venv-studio/bin/python - <<'PY'
          import json, os, signal, subprocess, sys, time, urllib.request
          from pathlib import Path
          root = Path.cwd().resolve()
          pidfile = root / 'out/anamorphic-studio/server.pid'
          url = 'http://127.0.0.1:8766/api/status'
          def status():
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      return json.load(response)
              except (OSError, ValueError):
                  return None
          def owned_server(pid):
              result = subprocess.run(['ps', '-p', str(pid), '-o', 'stat=', '-o', 'command='],
                                      capture_output=True, text=True, timeout=5)
              fields = result.stdout.strip().split(maxsplit=1)
              if not fields or fields[0].startswith('Z'):
                  return False
              command = fields[1] if len(fields) == 2 else ''
              expected = str(root / '.venv-studio/bin/python')
              if not command.startswith(expected + ' ') or 'tools/anamorphic-studio/server.py' not in command:
                  raise RuntimeError('Refusing to signal a PID that is not this checkout\'s server')
              if os.getpgid(pid) != pid:
                  raise RuntimeError('Expected the owned server to have its own POSIX session')
              return True
          assert status() is None, 'A pre-existing service must not be reused or stopped'
          assert not pidfile.exists(), 'CI lifecycle requires a fresh owned PID record'
          launcher = subprocess.Popen(['bash', 'START ANAMORPHIC STUDIO.command', '--no-browser'],
                                      start_new_session=True, stdin=subprocess.DEVNULL)
          try:
              assert launcher.wait(timeout=120) == 0, 'START wrapper failed'
              current = status()
              assert current and current['app'] == 'Anamorphic Studio' and current['ready'], current
              assert current['device'] == 'cpu', current
              with urllib.request.urlopen('http://127.0.0.1:8766/api/config', timeout=5) as response:
                  assert 'modern' in json.load(response)['profiles']
              subprocess.run(['bash', 'STOP ANAMORPHIC STUDIO.command', '--no-browser'], check=True, timeout=20)
              deadline = time.monotonic() + 10
              while status() is not None and time.monotonic() < deadline:
                  time.sleep(.2)
              assert status() is None, 'STOP wrapper did not stop its service'
          finally:
              try:
                  subprocess.run(['bash', 'STOP ANAMORPHIC STUDIO.command', '--no-browser'], timeout=20, check=False)
              except subprocess.TimeoutExpired:
                  pass
              # Stop the known launcher session first so it cannot create a late server.
              try:
                  os.killpg(launcher.pid, signal.SIGTERM)
                  time.sleep(.2)
                  os.killpg(launcher.pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass
              launcher.wait(timeout=5)
              if pidfile.exists():
                  pid = int(pidfile.read_text().strip())
                  assert pid > 1
                  if owned_server(pid):
                      os.killpg(pid, signal.SIGTERM)
                      deadline = time.monotonic() + 5
                      while owned_server(pid) and time.monotonic() < deadline:
                          time.sleep(.2)
                      if owned_server(pid):
                          os.killpg(pid, signal.SIGKILL)
              assert status() is None, 'Owned CI service remains reachable after cleanup'
          PY
      - name: Show service diagnostics on failure
        if: failure()
        shell: bash
        run: |
          if [[ -f out/anamorphic-studio/server.log ]]; then
            tail -n 100 out/anamorphic-studio/server.log
          fi
